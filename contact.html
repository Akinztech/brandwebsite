<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#071d2d">
	<title>Contact | Synergy 5</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="CSS/contact.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="content-page contact-page">
	<header class="site-header">
		<a class="brand" href="index.html" aria-label="Synergy 5 home">SYNERGY <span>5</span></a>
		<nav class="primary-nav" aria-label="Main navigation">
			<ul class="nav-links">
				<li><a href="index.html">Home</a></li>
				<li><a href="about.html">About</a></li>
				<li><a href="solutions.html">Solutions</a></li>
				<li><a href="contact.html" aria-current="page">Contact</a></li>
				<li><a href="blog.html">Blog</a></li>
			</ul>
		</nav>
	</header>

	<main class="content-main contact-main">
		<section class="contact-section" aria-labelledby="contact-title">
			<div class="contact-heading">
				<p class="contact-eyebrow">We'd love to hear from you</p>
				<h1 id="contact-title">Let's connect</h1>
			</div>

			<div class="contact-panel">
				<form class="contact-form" action="mailto:info@synergy5.co" method="post" enctype="text/plain">
					<label for="contact-name">Name</label>
					<input id="contact-name" name="Name" type="text" autocomplete="name" placeholder="Your name" required>

					<label for="contact-email">Email</label>
					<input id="contact-email" name="Email" type="email" autocomplete="email" placeholder="you@example.com" required>

					<label for="contact-message">Message</label>
					<textarea id="contact-message" name="Message" rows="5" placeholder="How can we help?" required></textarea>

					<button class="contact-submit" type="submit">Send message <i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>
				</form>

				<aside class="contact-details" aria-labelledby="contact-details-title">
					<h2 id="contact-details-title">Contact info</h2>
					<a href="mailto:info@synergy5.co"><i class="fa-regular fa-envelope" aria-hidden="true"></i> info@synergy5.co</a>
					<a href="tel:+15551234567"><i class="fa-solid fa-phone" aria-hidden="true"></i> +1 (555) 123-4567</a>
					<p><i class="fa-solid fa-location-dot" aria-hidden="true"></i> 789 Innovation Ave,<br>Tech City</p>
					<nav class="contact-socials" aria-label="Social media">
						<a href="https://linkedin.com" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
						<a href="https://twitter.com" aria-label="Twitter"><i class="fa-brands fa-twitter" aria-hidden="true"></i></a>
						<a href="https://instagram.com" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
					</nav>
				</aside>
			</div>
		</section>
	</main>

	<footer class="site-footer">
		<a class="footer-brand" href="index.html">SYNERGY <span>5</span></a>
		<nav class="social-links" aria-label="Social media">
			<a href="https://linkedin.com" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
			<a href="https://twitter.com" aria-label="Twitter"><i class="fa-brands fa-twitter" aria-hidden="true"></i></a>
			<a href="https://instagram.com" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
		</nav>
	</footer>
</body>
</html>
